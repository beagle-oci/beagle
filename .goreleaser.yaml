# GoReleaser configuration: builds beagle for Linux and macOS and publishes
# the archives to GitHub Releases when a v* tag is pushed. Each archive gets an
# SPDX SBOM (syft), and checksums.txt, which covers archives and SBOMs, is
# signed keyless with cosign (checksums.txt.sigstore.json).
# Test locally with: goreleaser release --snapshot --clean --skip=sign
version: 2

project_name: beagle

builds:
  - id: beagle
    main: ./cmd/beagle
    binary: beagle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: beagle
    formats: [tar.gz]
    # No version in the file name, so install.sh can use the stable
    # .../releases/latest/download/<name> URL.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

# Keyless signing with the GitHub Actions OIDC identity of the release
# workflow. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/beagle-oci/beagle/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
